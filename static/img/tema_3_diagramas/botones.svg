<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 156" width="540" role="img" aria-label="Tres tipos de botón: Button relleno, OutlinedButton con contorno y TextButton solo texto"><rect x="20" y="24" width="150" height="48" rx="24" fill="#2563eb" /><text x="95" y="54" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Confirmar</text><rect x="200" y="24" width="150" height="48" rx="24" fill="none" stroke="#2563eb" stroke-width="2" /><text x="275" y="54" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2563eb">Cancelar</text><text x="445" y="54" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2563eb">Más información</text><text x="95" y="100" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1e293b">Button</text><text x="95" y="120" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#8b95a5">relleno</text><text x="275" y="100" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1e293b">OutlinedButton</text><text x="275" y="120" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#8b95a5">contorno</text><text x="445" y="100" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1e293b">TextButton</text><text x="445" y="120" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#8b95a5">solo texto</text><text x="95" y="142" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#8b95a5">acción principal</text><text x="275" y="142" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#8b95a5">acción secundaria</text><text x="445" y="142" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#8b95a5">acción terciaria</text></svg>